name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: KozakyLab-windows.zip
          - os: macos-latest
            asset: KozakyLab-macos.zip
          - os: ubuntu-22.04
            asset: KozakyLab-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: pip install pyinstaller pillow
      - run: pyinstaller --onefile --windowed --name KozakyLab --icon assets/icon.ico --add-data "assets/icon.png:assets" kozakylab.py
      - name: package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/KozakyLab.exe -DestinationPath ${{ matrix.asset }}
      - name: package (macos)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/KozakyLab.app ${{ matrix.asset }}
      - name: package (linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset }} -C dist KozakyLab
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset }}
